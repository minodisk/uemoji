name: Test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "9.14.4"
      - name: Install dependencies
        run: pnpm i
      # - name: Check
      #   run: pnpm run check
      - name: Test
        run: pnpm run test
